<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos | DoBig Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="navbar">
        <div class="logo"><a href="index.html">Samu<span>.</span></a></div>
        <a href="index.html" class="btn-nav hover-wobble"><i class="ph-bold ph-arrow-left"></i> Voltar</a>
    </nav>

    <header class="games-header">
        <h1>Nossos Jogos 🎮</h1>
        <p>Explore nosso multiverso de diversão.</p>
    </header>

    <section class="games-grid-section">
        <div class="grid-container">
            <div class="card game-card">
                <div class="game-thumb">
                    <img src="assets/mar_sad.webp" alt="Game">
                </div>
                <div class="game-info">
                    <h3>Blade Ball</h3>
                    <div class="game-stats">
                        <span class="stat"><i class="ph-bold ph-play"></i> 5.9B</span>
                        <span class="stat highlight-stat">🟢 20k On</span>
                    </div>
                    <a href="#" class="btn btn-secondary full-width">Jogar</a>
                </div>
            </div>

            <div class="card game-card">
                <div class="game-thumb">
                    <img src="assets/mar_sad.webp" alt="Game">
                </div>
                <div class="game-info">
                    <h3>The Night Shift</h3>
                    <div class="game-stats">
                        <span class="stat"><i class="ph-bold ph-play"></i> 1.2B</span>
                        <span class="stat">🔴 Offline</span>
                    </div>
                    <a href="#" class="btn btn-secondary full-width">Jogar</a>
                </div>
            </div>
            
            </div>
    </section>

    <script src="script/main.js"></script>
</body>
</html>
